<pl-question-panel>
  <p>Responda às cinco partes.</p>
</pl-question-panel>

<pl-number-input answers-name="num" label="Velocidade:" suffix="m/s"></pl-number-input>

<pl-integer-input answers-name="int" label="Quantidade:"></pl-integer-input>

<pl-string-input answers-name="txt" label="Cor:"></pl-string-input>

<pl-multiple-choice answers-name="mc" order="fixed">
  <pl-answer correct="false">Vermelho</pl-answer>
  <pl-answer correct="true">Azul</pl-answer>
  <pl-answer correct="false">Verde</pl-answer>
  <pl-answer correct="false">Amarelo</pl-answer>
</pl-multiple-choice>

<pl-checkbox answers-name="cb" order="fixed" partial-credit="net-correct">
  <pl-answer correct="true">Dois</pl-answer>
  <pl-answer correct="false">Nove</pl-answer>
  <pl-answer correct="true">Sete</pl-answer>
  <pl-answer correct="false">Dez</pl-answer>
</pl-checkbox>
