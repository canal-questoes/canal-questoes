# Dependabot: propõe, toda semana, as atualizações das dependências do projeto.
#
# - `uv` na raiz: o workspace Python (o `pyproject.toml` e o `uv.lock` da raiz), com o `uv-build` no `ignore`: o limite
#   dele nos `pyproject.toml` acompanha o uv do `Dockerfile` e do CI, e a troca do uv é uma decisão manual;
# - `npm` em `/engine`: o `package.json` do motor (hoje sem dependências; a entrada fica pronta para quando houver);
# - `github-actions` na raiz: as ações dos workflows em `.github/workflows`, fixadas pelo SHA;
# - `docker` na raiz: a imagem base do `Dockerfile` da raiz, com as versões menores e maiores da imagem `python` no
#   `ignore`: o projeto fixa o Python 3.12 (o `requires-python` dos `pyproject.toml`), e trocar a versão do Python é
#   uma decisão manual;
# - `docker` em `/engine`: o `Dockerfile` do motor, com a imagem do PrairieLearn no `ignore`: ela fica fixada pelo commit
#   e pelo digest de propósito, para o motor corrigir exatamente como a versão conferida do PrairieLearn (a troca é uma
#   decisão manual). Hoje é a única imagem desse arquivo; a entrada fica pronta para outras;
# - `docker-compose` na raiz: as imagens do `compose.yaml`.
#
# As imagens usadas só nos testes (em `engine/test` e em `tests/system`) ficam de fora.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "uv-build"

  - package-ecosystem: npm
    directory: /engine
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker
    directory: /engine
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "prairielearn/prairielearn"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
